spring.application.name=marketplace


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.username = moussandour01
spring.datasource.password = 20010831A
spring.datasource.url = jdbc:postgresql://localhost:5432/marketplace



# --- Flyway configuration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Force Hibernate à utiliser sa stratégie de nommage native (standard)
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl