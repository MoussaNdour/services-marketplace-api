services:
  app:
    build: .
    container_name: marketplace-app
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - my-network

    develop:
      watch:
        - action: rebuild
          path: pom.xml
        - action: rebuild
          path: src/main

  postgres:
    image: 'postgres:15'
    container_name: marketplace-db
    environment:
      - 'POSTGRES_DB=marketplace'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD}'
      - 'POSTGRES_USER=${DATABASE_USERNAME}'
      - 'PGDATA=/var/lib/postgresql/data/pgdata'
    volumes:
      - db-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"
    networks:
      - my-network


networks:
  my-network:
    driver: bridge

volumes:
  db-data:
